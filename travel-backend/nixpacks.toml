# Nixpacks configuration for Railway
[phases.setup]
aptPkgs = ["gcc", "libpq-dev"]

[phases.build]
cmds = [
  "mkdir -p logs",
  "python manage.py collectstatic --noinput --clear"
]

[start]
cmd = "python manage.py migrate --noinput && python -m gunicorn travelapi.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --log-level info --access-logfile - --error-logfile -"
