# Nixpacks configuration for Railway
[phases.setup]
aptPkgs = ["gcc", "libpq-dev"]

[phases.build]
cmds = [
  "mkdir -p logs",
  "python manage.py collectstatic --noinput --clear"
]

[start]
cmd = "python manage.py check && python manage.py migrate --noinput && gunicorn travelapi.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"
